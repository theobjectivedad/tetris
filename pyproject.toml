[project]
name = "tetris"
version = "0.1.0"
description = "A terminal-based Tetris game built with curses"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0",
    "pyte>=0.8.1",
]

[project.scripts]
tetris-vt-server = "tetris.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tetris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
