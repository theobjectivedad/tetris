[project]
name = "tetris-vt"
version = "0.1.0"
description = "MCP server that runs terminal Tetris in a virtual terminal so an agent can play-test it visually"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
    "pyte>=0.8.1",
]

[project.scripts]
tetris-vt-server = "tetris_vt.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tetris_vt"]
