name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      # mcp + pyte are regular project dependencies (the bundled MCP
      # play-test server); the dev extra adds ruff, mypy and pytest.
      # Versions resolve from uv.lock, so this matches the local gate.
      - name: Install dependencies
        run: uv sync --extra dev

      # Quality gate — run the tools directly instead of via `just`
      # (no just dependency in CI). Mirrors `just check` + `just test`.
      - name: Ruff (lint)
        run: uv run ruff check src tests

      - name: mypy (strict)
        run: uv run mypy --strict src/tetris

      - name: pytest
        run: uv run pytest
